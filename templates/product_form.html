
{% extends 'base.html' %}

{% block title %}Product Form{% endblock %}

{% block content %}
<h1>{% if product %}Edit Product{% else %}Add Product{% endif %}</h1>

<form method="post" class="form">
    {% csrf_token %}

    <label>Product Name</label>
    <input type="text" name="name" value="{{ product.name|default:'' }}" required>

    <label>Category</label>
    <input type="text" name="category" value="{{ product.category|default:'' }}" required>

    <label>Price (₹)</label>
    <input type="number" name="price" min="0.01" step="0.01" value="{{ product.price|default:'' }}" required>

    <label>Quantity</label>
    <input type="number" name="quantity" min="0" step="1" value="{{ product.quantity|default:'0' }}" required>

    <label>Description</label>
    <textarea name="description">{{ product.description|default:'' }}</textarea>

    <button type="submit">Save Product</button>
</form>
{% endblock %}
